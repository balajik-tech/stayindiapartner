name: stayindia_owner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  dio: ^5.7.0
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  get_it: ^8.0.3
  path_provider: ^2.1.5
  responsive_sizer: ^3.3.1
  flutter_secure_storage: ^9.2.2
  file_picker: ^11.0.2
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  socket_io_client: ^2.0.3
  flutter_local_notifications: ^21.0.0
  connectivity_plus: ^6.0.3
  logger: ^2.4.0
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  image_picker: ^1.2.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  hydrated_bloc: ^9.1.5
  lottie: ^3.3.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  easy_localization: ^3.0.8
  shared_preferences: ^2.5.5
  share_plus: ^12.0.2
  font_awesome_flutter: ^11.0.0
  image_cropper: ^12.2.1
  google_mlkit_image_labeling: ^0.14.2
  image: ^4.8.0
  package_info_plus: ^9.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_crashlytics: ^5.2.2
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_text_recognition: ^0.15.1
  google_sign_in: ^6.2.1
  google_phone_number_hint: ^0.0.3
  smart_auth: ^3.2.0
  flutter_digilocker_aadhar_pan: ^1.0.0
  dartz: ^0.10.1
  razorpay_flutter: 1.4.0
  flutter_tts: ^4.2.3
  diacritic: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^9.1.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_cropped.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#F07B1D"
  adaptive_icon_foreground: "assets/images/logo_adaptive_fg.jpg"

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/


  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700